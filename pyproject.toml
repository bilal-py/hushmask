[project]
name = "hushmask"
version = "0.1.0"
description = "Hide names, emails, IBANs and addresses before text reaches an AI, and put them back in the answer."
readme = "README.md"
authors = [
    { name = "Bilal", email = "bilalrizvi2110@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["privacy", "pii", "llm", "openai", "proxy", "anonymization", "pseudonymization", "gdpr", "redaction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://bilal-py.github.io/hushmask/"
Source = "https://github.com/bilal-py/hushmask"
Issues = "https://github.com/bilal-py/hushmask/issues"
Evaluation = "https://github.com/bilal-py/hushmask/blob/main/docs/eval/RESULTS.md"

[project.scripts]
hushmask = "hushmask.cli:main"

[project.optional-dependencies]
# everything most people want: the proxy + dashboard and the names model (ONNX, ~0.6 GB on first use)
all = ["hushmask[proxy,ner]"]
ner = [
    "numpy>=2.5.5",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]
proxy = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]
ner-torch = [
    "gliner>=0.2.30",
    "protobuf>=7.36.2",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
